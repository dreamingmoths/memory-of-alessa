name: bow
sha1: a68a7bbcdc21ac28063416ca453698f7bb4cf51c
options:
  basename: bow
  elf_path: bow.bin
  target_path: rom/overlay/bow.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/bow_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/bow_reloc_addrs.txt
  ld_script_path: linkers/bow.ld
  undefined_funcs_auto_path: linkers/bow_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/bow_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: bow
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, bow_overlay_header]
      - [0x80, c, Event/stage/stg_bowling]
      - [0xB80, data, Event/stage/stg_bowling_data]
      - { vram: 0x1F26700, type: bss, name: Event/stage/stg_bowling_bss }
  - [0x1280]
