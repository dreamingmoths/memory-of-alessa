name: hxf
sha1: 1340f6c83c32939d84ec2b6dd3a03808447744db
options:
  basename: hxf
  elf_path: hxf.bin
  target_path: rom/overlay/hxf.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/hxf_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/hxf_reloc_addrs.txt
  ld_script_path: linkers/hxf.ld
  undefined_funcs_auto_path: linkers/hxf_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/hxf_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: hxf
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, hxf_overlay_header]
      - [0x80, c, Event/stage/stg_hospital_1f_f]
      - [0x1000, data, Event/stage/stg_hospital_1f_f_data]
      - { vram: 0x1F27180, type: bss, name: Event/stage/stg_hospital_1f_f_bss }
  - [0x1D00]
