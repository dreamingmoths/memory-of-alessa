name: xmb
sha1: 1389cd8ad1db97c743a836270185ce641ba2f50b
options:
  basename: xmb
  elf_path: xmb.bin
  target_path: rom/overlay/xmb.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/xmb_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/xmb_reloc_addrs.txt
  ld_script_path: linkers/xmb.ld
  undefined_funcs_auto_path: linkers/xmb_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/xmb_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: xmb
    type: code
    vram: 0x1F25480
    start: 0x0
    subsegments:
      - [0x0, databin, xmb_overlay_header]
      - [0x80, c, Event/stage/stg_x_mansion_bf]
      - [0x280, data, Event/stage/stg_x_mansion_bf_data]
  - [0x700]
