name: tww
sha1: eab7847a899e4e7e792e3ac317b4819d7c8da106
options:
  basename: tww
  elf_path: tww.bin
  target_path: rom/overlay/tww.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/tww_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/tww_reloc_addrs.txt
  ld_script_path: linkers/tww.ld
  undefined_funcs_auto_path: linkers/tww_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/tww_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: tww
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x100
    subsegments:
      - [0x0, databin, tww_overlay_header]
      - [0x80, c, Event/stage/stg_town_west]
      - [0x5A00, data, Event/stage/stg_town_west_data]
      - { vram: 0x1F2E980, type: bss, name: Event/stage/stg_town_west_bss }
  - [0x9500]
