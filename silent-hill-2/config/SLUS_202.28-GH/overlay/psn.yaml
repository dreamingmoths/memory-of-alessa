name: psn
sha1: d50751278469c6b8a417ab6b64f1894556a88399
options:
  basename: psn
  elf_path: psn.bin
  target_path: rom/overlay/psn.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/psn_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/psn_reloc_addrs.txt
  ld_script_path: linkers/psn.ld
  undefined_funcs_auto_path: linkers/psn_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/psn_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: psn
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, psn_overlay_header]
      - [0x80, c, Event/stage/stg_prison_n]
      - [0x1980, data, Event/stage/stg_prison_n_data]
      - { vram: 0x1F27E00, type: bss, name: Event/stage/stg_prison_n_bss }
  - [0x2980]
