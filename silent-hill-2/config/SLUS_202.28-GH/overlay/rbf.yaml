name: rbf
sha1: 17456a763d10fe1bf39f6f69f7518bd77b41d189
options:
  basename: rbf
  elf_path: rbf.bin
  target_path: rom/overlay/rbf.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/rbf_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/rbf_reloc_addrs.txt
  ld_script_path: linkers/rbf.ld
  undefined_funcs_auto_path: linkers/rbf_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/rbf_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: rbf
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, rbf_overlay_header]
      - [0x80, c, Event/stage/stg_hotel_bf_f]
      - [0xD00, data, Event/stage/stg_hotel_bf_f_data]
      - { vram: 0x1F26A00, type: bss, name: Event/stage/stg_hotel_bf_f_bss }
  - [0x1580]
