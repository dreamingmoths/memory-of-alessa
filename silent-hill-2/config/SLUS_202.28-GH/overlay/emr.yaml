name: emr
sha1: 1688a638782e77429171fec85095f4be303536b8
options:
  basename: emr
  elf_path: emr.bin
  target_path: rom/overlay/emr.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/emr_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/emr_reloc_addrs.txt
  ld_script_path: linkers/emr.ld
  undefined_funcs_auto_path: linkers/emr_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/emr_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: emr
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0xD80
    subsegments:
      - [0x0, databin, emr_overlay_header]
      - [0x80, c, Event/stage/stg_end_maria]
      - [0x1880, data, Event/stage/stg_end_maria_data]
      - { vram: 0x1F27B00, type: bss, name: Event/stage/stg_end_maria_bss }
  - [0x2680]
