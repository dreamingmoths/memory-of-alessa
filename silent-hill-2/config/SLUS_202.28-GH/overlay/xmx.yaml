name: xmx
sha1: b353514b567d560cb226afb8aece8fc4fe109e42
options:
  basename: xmx
  elf_path: xmx.bin
  target_path: rom/overlay/xmx.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/xmx_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/xmx_reloc_addrs.txt
  ld_script_path: linkers/xmx.ld
  undefined_funcs_auto_path: linkers/xmx_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/xmx_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: xmx
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, xmx_overlay_header]
      - [0x80, c, Event/stage/stg_x_mansion_1f]
      - [0x3580, data, Event/stage/stg_x_mansion_1f_data]
      - { vram: 0x1F29D00, type: bss, name: Event/stage/stg_x_mansion_1f_bss }
  - [0x4880]
