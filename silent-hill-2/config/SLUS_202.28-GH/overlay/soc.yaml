name: soc
sha1: 6c125a118b71364a182a0818204d1d8dea474fc4
options:
  basename: soc
  elf_path: soc.bin
  target_path: rom/overlay/soc.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/soc_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/soc_reloc_addrs.txt
  ld_script_path: linkers/soc.ld
  undefined_funcs_auto_path: linkers/soc_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/soc_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: soc
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, soc_overlay_header]
      - [0x80, c, Event/stage/stg_society]
      - [0x380, data, Event/stage/stg_society_data]
      - { vram: 0x1F25B00, type: bss, name: Event/stage/stg_society_bss }
  - [0x680]
