name: psb
sha1: 243dc49098affe3079c3112ba0d1e3306e5b70e5
options:
  basename: psb
  elf_path: psb.bin
  target_path: rom/overlay/psb.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/psb_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/psb_reloc_addrs.txt
  ld_script_path: linkers/psb.ld
  undefined_funcs_auto_path: linkers/psb_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/psb_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: psb
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, psb_overlay_header]
      - [0x80, c, Event/stage/stg_prison_bf]
      - [0xE00, data, Event/stage/stg_prison_bf_data]
      - { vram: 0x1F26900, type: bss, name: Event/stage/stg_prison_bf_bss }
  - [0x1480]
