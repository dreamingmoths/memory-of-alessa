name: hps
sha1: 746e2b8d527eed9c333d818f9886077aba7a0e6f
options:
  basename: hps
  elf_path: hps.bin
  target_path: rom/overlay/hps.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/hps_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/hps_reloc_addrs.txt
  ld_script_path: linkers/hps.ld
  undefined_funcs_auto_path: linkers/hps_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/hps_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: hps
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, hps_overlay_header]
      - [0x80, c, Event/stage/stg_hospital_pass]
      - [0x700, data, Event/stage/stg_hospital_pass_data]
      - { vram: 0x1F25F00, type: bss, name: Event/stage/stg_hospital_pass_bss }
  - [0xA80]
