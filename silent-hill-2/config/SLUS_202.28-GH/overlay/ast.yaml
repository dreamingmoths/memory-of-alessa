name: ast
sha1: ae86db0ea4228e9d4031dd1fa42671e025222e61
options:
  basename: ast
  elf_path: ast.bin
  target_path: rom/overlay/ast.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/ast_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/ast_reloc_addrs.txt
  ld_script_path: linkers/ast.ld
  undefined_funcs_auto_path: linkers/ast_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/ast_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: ast
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, ast_overlay_header]
      - [0x80, c, Event/stage/stg_apart_stair]
      - [0xD80, data, Event/stage/stg_apart_stair_data]
      - { vram: 0x1F26C00, type: bss, name: Event/stage/stg_apart_stair_bss }
  - [0x1780]
