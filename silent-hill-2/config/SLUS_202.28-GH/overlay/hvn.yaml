name: hvn
sha1: 2e33810fd40af735a86cc9b42895b6eeb9f60441
options:
  basename: hvn
  elf_path: hvn.bin
  target_path: rom/overlay/hvn.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/hvn_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/hvn_reloc_addrs.txt
  ld_script_path: linkers/hvn.ld
  undefined_funcs_auto_path: linkers/hvn_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/hvn_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: hvn
    type: code
    vram: 0x1F25480
    start: 0x0
    subsegments:
      - [0x0, databin, hvn_overlay_header]
      - [0x80, c, Event/stage/stg_heaven_night]
      - [0x100, data, Event/stage/stg_heaven_night_data]
  - [0x480]
