name: hrf
sha1: 091c5af4782d889387cee1a90e4a34e82f8898b0
options:
  basename: hrf
  elf_path: hrf.bin
  target_path: rom/overlay/hrf.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/hrf_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/hrf_reloc_addrs.txt
  ld_script_path: linkers/hrf.ld
  undefined_funcs_auto_path: linkers/hrf_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/hrf_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: hrf
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, hrf_overlay_header]
      - [0x80, c, Event/stage/stg_hospital_rf_f]
      - [0x1780, data, Event/stage/stg_hospital_rf_f_data]
      - { vram: 0x1F27500, type: bss, name: Event/stage/stg_hospital_rf_f_bss }
  - [0x2080]
