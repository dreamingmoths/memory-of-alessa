name: rzf
sha1: 2070521d488d0a46061de3b60454504e055a1a39
options:
  basename: rzf
  elf_path: rzf.bin
  target_path: rom/overlay/rzf.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/rzf_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/rzf_reloc_addrs.txt
  ld_script_path: linkers/rzf.ld
  undefined_funcs_auto_path: linkers/rzf_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/rzf_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: rzf
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x800
    subsegments:
      - [0x0, databin, rzf_overlay_header]
      - [0x80, c, Event/stage/stg_hotel_3f_f]
      - [0x1B80, data, Event/stage/stg_hotel_3f_f_data]
      - { vram: 0x1F27A80, type: bss, name: Event/stage/stg_hotel_3f_f_bss }
  - [0x2600]
