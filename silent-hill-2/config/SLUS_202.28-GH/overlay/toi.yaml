name: toi
sha1: f722a771d47af18b5edc701b82ad28b25af6f979
options:
  basename: toi
  elf_path: toi.bin
  target_path: rom/overlay/toi.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/toi_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/toi_reloc_addrs.txt
  ld_script_path: linkers/toi.ld
  undefined_funcs_auto_path: linkers/toi_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/toi_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: toi
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x200
    subsegments:
      - [0x0, databin, toi_overlay_header]
      - [0x80, c, Event/stage/stg_toilet]
      - [0xE80, data, Event/stage/stg_toilet_data]
      - { vram: 0x1F26700, type: bss, name: Event/stage/stg_toilet_bss }
  - [0x1280]
