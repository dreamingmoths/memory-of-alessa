name: pss
sha1: cdba3ca7c076e118b4915880b9e18386c7155098
options:
  basename: pss
  elf_path: pss.bin
  target_path: rom/overlay/pss.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/pss_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/pss_reloc_addrs.txt
  ld_script_path: linkers/pss.ld
  undefined_funcs_auto_path: linkers/pss_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/pss_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: pss
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, pss_overlay_header]
      - [0x80, c, Event/stage/stg_prison_s]
      - [0x1280, data, Event/stage/stg_prison_s_data]
      - { vram: 0x1F27280, type: bss, name: Event/stage/stg_prison_s_bss }
  - [0x1E00]
