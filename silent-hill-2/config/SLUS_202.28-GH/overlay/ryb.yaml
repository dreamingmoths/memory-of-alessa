    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, ryb_overlay_header]
      - [0x80, c, Event/stage/stg_hotel_2f_b]
      - [0x900, data, Event/stage/stg_hotel_2f_b_data]
