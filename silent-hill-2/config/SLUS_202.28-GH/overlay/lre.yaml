name: lre
sha1: 02be2f41e49bbe7f9bd74375bdd514bef00d1dcc
options:
  basename: lre
  elf_path: lre.bin
  target_path: rom/overlay/lre.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/lre_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/lre_reloc_addrs.txt
  ld_script_path: linkers/lre.ld
  undefined_funcs_auto_path: linkers/lre_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/lre_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: lre
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, lre_overlay_header]
      - [0x80, c, Event/stage/stg_labyrinth_e]
      - [0x1800, data, Event/stage/stg_labyrinth_e_data]
      - { vram: 0x1F27F00, type: bss, name: Event/stage/stg_labyrinth_e_bss }
  - [0x2A80]
