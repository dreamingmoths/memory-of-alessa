name: lrw
sha1: 2d387bb454b2092c6118c6f39c6f4564d03273ac
options:
  basename: lrw
  elf_path: lrw.bin
  target_path: rom/overlay/lrw.bin
  find_file_boundaries: False
  asm_path: asm
  symbol_addrs_path:
   - overlay/lrw_symbol_addrs.txt
   - symbol_addrs.txt
   - sdk_symbol_addrs.txt
  reloc_addrs_path: overlay/lrw_reloc_addrs.txt
  ld_script_path: linkers/lrw.ld
  undefined_funcs_auto_path: linkers/lrw_undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/lrw_undefined_syms_auto.main.txt
  symbol_name_format: $VRAM_$SEG
segments:
  - name: lrw
    type: code
    vram: 0x1F25480
    start: 0x0
    bss_size: 0x80
    subsegments:
      - [0x0, databin, lrw_overlay_header]
      - [0x80, c, Event/stage/stg_labyrinth_w]
      - [0x3300, data, Event/stage/stg_labyrinth_w_data]
      - { vram: 0x1F29A00, type: bss, name: Event/stage/stg_labyrinth_w_bss }
  - [0x4580]
